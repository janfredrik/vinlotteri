server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name vin.domene.no;

    include /config/nginx/ssl.conf;

    client_max_body_size 5m;

                                                    
  location / {                                                                                                                                                                                                              
      include /config/nginx/proxy.conf;
      include /config/nginx/resolver.conf;                                                                                                                                                      
      proxy_pass http://10.0.0.100:3105;

        # Server-Sent Events (live grid / winners) need buffering off
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";       
  }        
}